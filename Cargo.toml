[package]
name = "erp-http"
version = "0.1.0"
edition = "2021"

[dependencies]
contreforts-core = { workspace = true, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version="1", features = ["macros", "rt-multi-thread"]}